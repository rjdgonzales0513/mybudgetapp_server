spring.application.name=household-budget-api
server.port=8081

# --- PostgreSQL connection ---
# Update the username/password to match your local Postgres setup.
# Create the database first with: createdb household_budget
spring.datasource.url=jdbc:postgresql://localhost:5432/mybudgetapp
spring.datasource.username=postgres
spring.datasource.password=Password@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true