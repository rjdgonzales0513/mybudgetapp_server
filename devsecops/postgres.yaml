apiVersion: v1
kind: Secret
metadata:
  name: postgresmybudgetapp-secret
  namespace: mybudgetapp
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: Password@123
  POSTGRES_DB: mybudgetapp

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresmybudgetapp-pvc
  namespace: mybudgetapp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresmybudgetapp
  namespace: mybudgetapp
spec:
  serviceName: postgresmybudgetapp
  replicas: 1

  selector:
    matchLabels:
      app: postgresmybudgetapp

  template:
    metadata:
      labels:
        app: postgresmybudgetapp

    spec:
      containers:
        - name: postgresmybudgetapp
          image: postgres:17

          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: postgresmybudgetapp-secret

          volumeMounts:
            - name: postgresmybudgetapp-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgresmybudgetapp-storage
          persistentVolumeClaim:
            claimName: postgresmybudgetapp-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: postgresmybudgetapp
  namespace: mybudgetapp
spec:
  selector:
    app: postgresmybudgetapp

  ports:
    - port: 5432
      targetPort: 5432