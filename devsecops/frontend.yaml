apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mybudgetapp
spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      imagePullSecrets:
        - name: gitlab-registry-frontend-secret
      containers:
        - name: frontend
          image: registry.gitlab.com/mybudgetapp1/mybudgetapp_client/mybudgetapp_client:latest

          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mybudgetapp
spec:
  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 80