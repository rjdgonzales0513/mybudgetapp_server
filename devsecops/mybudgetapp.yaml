apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mybudgetapp
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: backend
          image: registry.gitlab.com/mybudgetapp1/mybudgetapp_server/backend:latest
          ports:
            - containerPort: 8081

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresmybudgetapp:5432/mybudgetapp

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgresmybudgetapp-secret
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresmybudgetapp-secret
                  key: POSTGRES_PASSWORD

---

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mybudgetapp
spec:
  selector:
    app: backend

  ports:
    - port: 8081
      targetPort: 8081