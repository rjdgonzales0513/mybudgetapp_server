apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mybudgetapp-ingress
  namespace: mybudgetapp
spec:
  ingressClassName: nginx
  rules:
    - host: mybudgetapp.local
      http:
        paths:

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8081

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80