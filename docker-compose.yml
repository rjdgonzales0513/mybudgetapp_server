services:
  postgres:
    image: postgres:15
    container_name: postgresDocker
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password@123
    ports:
      - "5432:5432"   # optional (for host access)
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: myjavaapp
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Password@123
    ports:
      - "8080:8080"

volumes:
  pgdata: