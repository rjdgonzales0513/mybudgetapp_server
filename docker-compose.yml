services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mybudgetapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password@123
    ports:
      - "5432:5432"   # optional (for host access)
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: mybudgetappserver
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mybudgetapp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Password@123
    ports:
      - "8081:8081"
    depends_on:
      - postgres

  frontend:
    image: mybudgetappfrontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data: