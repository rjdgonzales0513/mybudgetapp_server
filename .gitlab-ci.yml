stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"

build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/mybudgetapp_server:$CI_COMMIT_SHORT_SHA" ./mybudgetapp_server
    - docker push "$CI_REGISTRY_IMAGE/mybudgetapp_server:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'