stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"

build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/mybudgetapp_server:latest" ./backend
    - docker push "$CI_REGISTRY_IMAGE/mybudgetapp_server:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-backend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh ubuntu@$EC2_HOST "kubectl --kubeconfig=/home/ubuntu/.kube/config set image deployment/backend backend=$CI_REGISTRY_IMAGE/mybudgetapp_server:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'